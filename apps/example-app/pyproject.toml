[project]
name = "example-app"
version = "0.0.0"
description = "Example application using this framework"
requires-python = ">= 3.12"
license = "BSD-3-Clause"
authors = [{ name = "Dave Shawley", email = "daveshawley@gmail.com" }]
dependencies = [
  "fastapi-runner",
  "pyjwt[crypto]>=2.15.1",
  "uvicorn[standard]",
  "uvloop",
]

[project.entry-points.fastapi_runner]
configure = "example.app:configure"
lifespans = "example.app:lifespans"

[dependency-groups]
dev = [
  "pyrefly~=1.2",
  "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling~=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["example"]
