[project]
name = "jwt"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi-runner", "pyjwt[crypto]>=2.15.1", "uvicorn[standard]"]

[project.entry-points.fastapi_runner]
configure = "tutorial_jwt.app:configure"
lifespans = "tutorial_jwt.app:lifespans"

[build-system]
requires = ["hatchling~=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tutorial_jwt"]
