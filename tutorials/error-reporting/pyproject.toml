[project]
name = "error-reporting"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi-runner", "uvicorn[standard]"]

[project.entry-points.fastapi_runner]
configure = "tutorial_error_reporting.app:configure"

[build-system]
requires = ["hatchling~=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tutorial_error_reporting"]
