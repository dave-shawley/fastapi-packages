[project]
name = "tutorial-authorization-server"
version = "0.0.0"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "fastapi-runner",
  "pydantic",
  "pyjwt[crypto]~=2.15",
  "python-multipart>=0.0.34",
  "uvicorn[standard]",
]

[project.entry-points.fastapi_runner]
configure = "tutorial_auth_server.app:configure"
lifespans = "tutorial_auth_server.app:lifespans"

[build-system]
requires = ["hatchling~=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tutorial_auth_server"]
