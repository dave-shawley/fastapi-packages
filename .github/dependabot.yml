version: 2
updates:

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-major-days: 14
    ignore:
      - dependency-name: "tutorial-*"
    groups:
      security:
        applies-to: security-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      grouped-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
