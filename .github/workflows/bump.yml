name: bump.yml
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name'
        required: true
        type: string
      tag_body:
        description: 'Tag commit message'
        required: false
        type: string
        default: ''
      notes_since_tag:
        description: 'Optional tag to generate notes based on, used as --notes-start-tag'
        required: false
        type: string
        default: ''

jobs:

  validate-input:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.parse-version.outputs.version }}
    steps:
      - run: |
          if [ "$GITHUB_REF_NAME" != 'main' ] ; then
            echo '::error::Only main branch is allowed to create a release'
            exit 1
          fi
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e #v10.3.2
      - id: parse-version
        env:
          INPUT_TAG: "${{ github.event.inputs.tag }}"
        run: |
          # this will fail spectacularly if the input tag cannot
          # be parsed as a PEP-440 version number
          uv run --with=packaging python -c '
            import os
            import packaging.version
            v = packaging.version.Version(os.environ["INPUT_TAG"])
            print(f"version={v}")
          ' >> "$GITHUB_OUTPUT"

  create-tag:
    runs-on: ubuntu-26.04
    needs: [ validate-input ]
    permissions:
      contents: write  # allow release creation
    env:
      NOTES_SINCE_TAG: "${{ github.event.inputs.notes_since_tag }}"
      TAG_NAME: "${{ needs.validate-input.outputs.version }}"
      TAG_MESSAGE: "${{ github.event.inputs.tag_body }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e #v10.3.2
      - name: "Create draft release"
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: bash
        run: |
          args=()
          if [ -z "$TAG_MESSAGE" ] ; then
            args+=(--generate-notes)
            if [ -n "$NOTES_SINCE_TAG" ] ; then
              args+=(--notes-start-tag "$NOTES_SINCE_TAG")
            fi
          else
            printf '%s' "$TAG_MESSAGE" > "$RUNNER_TEMP/tag_message.txt"
            args+=(--notes-file "$RUNNER_TEMP/tag_message.txt")
          fi
          gh release create "$TAG_NAME" "${args[@]}" --draft --title "$TAG_NAME" --fail-on-no-commits
          gh release view "$TAG_NAME" --json body --jq .body > "$RUNNER_TEMP/tag_message.txt"
      - name: "Adjust packaging metadata"
        run: uv version "$TAG_NAME" --package=fastapi-runner
      - id: commit_tag
        name: "Commit changes and create tag"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        env:
          TAG_NAME: "${{ env.TAG_NAME }}"
        with:
          github-token: "${{ github.token }}"
          script: |
            const fs = require('node:fs');

            const { owner, repo } = context.repo;
            const branch = 'main';
            const paths = [
              'libraries/fastapi-runner/pyproject.toml',
              'uv.lock',
            ];

            const head = await github.graphql(`
              query ($owner: String!, $repo: String!, $ref: String!) {
                repository(owner: $owner, name: $repo) {
                  ref(qualifiedName: $ref) {
                    target { oid }
                  }
                }
              }
            `, {
              owner,
              repo,
              ref: `refs/heads/${branch}`,
            });

            const expectedHeadOid = head.repository.ref?.target.oid;
            if (!expectedHeadOid) {
              throw new Error(`Could not resolve ${branch} HEAD`);
            }

            const additions = paths.map((path) => ({
              path,
              contents: fs.readFileSync(path).toString('base64'),
            }));

            const commitResult = await github.graphql(`
              mutation ($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit {
                    oid
                    url
                    signature { isValid wasSignedByGitHub }
                  }
                }
              }
            `, {
              input: {
                branch: {
                  repositoryNameWithOwner: `${owner}/${repo}`,
                  branchName: branch,
                },
                expectedHeadOid,
                message: {
                  headline: `build(release): bump version to ${process.env.TAG_NAME}`,
                },
                fileChanges: { additions },
              },
            });

            const commit = commitResult.createCommitOnBranch.commit;
            if (!commit.signature?.isValid) {
              throw new Error('GitHub did not create a verified commit signature');
            }
            core.info(
              `Created verified commit ${commit.url}`
              + (commit.signature.wasSignedByGitHub ? ' using GitHub signing' : ''),
            );

            const tag = await github.rest.git.createTag({
              owner,
              repo,
              tag: process.env.TAG_NAME,
              message: fs.readFileSync(
                `${process.env.RUNNER_TEMP}/tag_message.txt`,
                'utf8',
              ),
              object: commit.oid,
              type: 'commit',
            });

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${process.env.TAG_NAME}`,
              sha: tag.data.sha,
            });

            core.info(`Created annotated tag ${process.env.TAG_NAME}`);
      - name: "Clean up draft release after commit or tag failure"
        if: ${{ failure() && steps.commit_tag.outcome == 'failure' }}
        continue-on-error: true
        env:
          GH_TOKEN: "${{ github.token }}"
        run: gh release delete "$TAG_NAME" --yes

  finish-release:
    runs-on: ubuntu-26.04
    needs: [ validate-input, create-tag ]
    env:
      TAG_NAME: "${{ needs.validate-input.outputs.version }}"
    permissions:
      contents: write  # allow release edit
    steps:
      - name: "Finish release"
        env:
          GH_TOKEN: "${{ secrets.CREATE_RELEASE_TOKEN }}"
        run: gh release edit "$TAG_NAME" --verify-tag --draft=false
