[project]
name = "fastapi-runner"
version = "0.1.0"
description = "Production-ready uvicorn runner for FastAPI applications"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
authors = [{ name = "Dave Shawley", email = "daveshawley@gmail.com" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "fastapi~=0.162.0",
  "pydantic~=2.13",
  "pydantic-settings~=2.14",
]

[dependency-groups]
dev = [
  "mkdocs-material>=9.8.0",
  "mkdocstrings[python]>=1.0.8",
  "pymdown-ietflinks>=0.0.0",
  "zensical>=0.0.72",
]

[build-system]
requires = ["hatchling~=1.32"]
build-backend = "hatchling.build"
