[project]
site_name = "fastapi-runner"
site_author = "Dave Shawley"
repo_url = "https://github.com/dave-shawley/fastapi-packages"
copyright = "&copy; 2026, Dave Shawley"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Learn" = [
    { "Build a minimal application" = "learn/minimal-app.md" },
  ] },
  { "How-to guides" = [
    { "Configure CORS" = "how-to/cors.md" },
    { "Configure access logging" = "how-to/access-logging.md" },
    { "Manage database connections" = "how-to/database-lifespan.md" },
    { "Customize error reporting" = "how-to/error-reporting.md" },
    { "Integrate JWT access tokens" = "how-to/jwt.md" },
    { "Deploy in Docker" = "how-to/docker.md" },
  ] },
  { "Explanation" = [
    { "Configuration and lifespan hooks" = "explanation/hooks.md" },
    { "Typesafe error handlers" = "explanation/error-handlers.md" },
    { "Typed lifespan state" = "explanation/lifespan-state.md" },
  ] },
  { "Reference" = [
    { "Entrypoint" = "reference/entrypoint.md" },
    { "Lifespan" = "reference/lifespan.md" },
    { "State" = "reference/state.md" },
    { "Middleware" = "reference/middleware.md" },
    { "Errors" = "reference/errors.md" },
    { "Error handling" = "reference/error-handling.md" },
    { "Types" = "reference/types.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "toc.follow",
  "toc.integrate",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.def_list]

[project.markdown_extensions.ietflinks]

[project.markdown_extensions.toc]
permalink = true
toc_depth = 2

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.superfences]

[project.plugins.mkdocstrings]
enable_inventory = true

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
merge_init_into_class = true
relative_crossrefs = true
show_bases = false
show_root_heading = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
summary = true
unwrap_annotated = true
