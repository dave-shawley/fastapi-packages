[project]
name = "fastapi-runner"
version = "0.0.0"
description = "Production-ready uvicorn runner for FastAPI applications"
readme = "README.md"
requires-python = ">=3.14"
license = "BSD-3-Clause"
authors = [{ name = "Dave Shawley", email = "daveshawley@gmail.com" }]
dependencies = []

[project.urls]
Repository = "https://github.com/dave-shawley/fastapi-runner"

[dependency-groups]
dev = [
  "coverage~=7.15",
  "pre-commit~=4.6",
  "pyrefly~=1.2",
  "pytest~=9.1",
  "ruff>=0.16.10",
  "tombi~=1.4",
]

[build-system]
requires = ["hatchling~=1.26"]
build-backend = "hatchling.build"

[tool.coverage.report]
show_missing = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.pyrefly]
infer-return-types = "never"
min-severity = "warn"
python-version = "3.14"
use-ignore-files = true  # just in case someone changes the default

[tool.ruff]
line-length = 79
target-version = "py314"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "DTZ",
  "E",
  "ERA",
  "F",
  "FBT",
  "FLY",
  "FURB",
  "G",
  "I",
  "ISC",
  "LOG",
  "N",
  "Q",
  "PIE",
  "PL",
  "PTH",
  "RET",
  "RSE",
  "S",
  "SIM",
  "SLF",
  "T10",
  "T20",
  "TC",
  "TRY",
  "UP",
  "W",
]
ignore = [
  "RSE102",  # I like to raise exception instances not classes
  "TC002",  # I don't like separating imports for type checking
  "TC003",  # This doesn't work with pydantic
  "TRY003",  # Allow messages in exception initializers
]
flake8-quotes = { inline-quotes = "single" }
pydocstyle = { convention = "google" }
isort = { split-on-trailing-comma = false }

[tool.ruff.lint.flake8-import-conventions]
aliases = { typing = "t" }
banned-aliases = { "collections.abc" = ["abc"] }
banned-from = ["typing"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["SLF001"]

# since I occasiontally work inside of a sandbox
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
