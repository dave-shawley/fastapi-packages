[project]
name = "fastapi-packages"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.14"
license = "BSD-3-Clause"
authors = [{ name = "Dave Shawley", email = "daveshawley@gmail.com" }]

[project.urls]
Repository = "https://github.com/dave-shawley/fastapi-packages"

[dependency-groups]
dev = [
  "coverage~=7.15",
  "httpx2~=2.13",
  "pre-commit~=4.6",
  "pyrefly~=1.2",
  "pytest~=9.1",
  "ruff>=0.16.10",
  "tombi~=1.4",
]

[build-system]
requires = ["hatchling~=1.26"]
build-backend = "hatchling.build"

[tool.coverage.report]
show_missing = true

[tool.coverage.run]
branch = true
# Note that source accepts module names as well as directories
source = ["fastapi_runner"]

[tool.pyrefly]
errors = { missing-override-decorator = false }
infer-return-types = "never"
min-severity = "warn"
preset = "strict"
python-version = "3.14"
use-ignore-files = true  # just in case someone changes the default

[tool.ruff]
line-length = 79
target-version = "py314"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "DTZ",
  "E",
  "ERA",
  "F",
  "FBT",
  "FLY",
  "FURB",
  "G",
  "I",
  "ISC",
  "LOG",
  "N",
  "Q",
  "PIE",
  "PL",
  "PTH",
  "RET",
  "RSE",
  "S",
  "SIM",
  "SLF",
  "T10",
  "T20",
  "TC",
  "TRY",
  "UP",
  "W",
]
ignore = [
  "RSE102",  # I like to raise exception instances not classes
  "TC001",  # I don't like separating imports for type checking
  "TC002",  # I don't like separating imports for type checking
  "TC003",  # This doesn't work with pydantic
  "TRY003",  # Allow messages in exception initializers
]
flake8-quotes = { inline-quotes = "single" }
pydocstyle = { convention = "google" }

[tool.ruff.lint.flake8-import-conventions]
aliases = { typing = "t" }
banned-aliases = { "collections.abc" = ["abc"] }
banned-from = ["typing"]

[tool.ruff.lint.isort]
known-first-party = ["fastapi_runner"]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["SLF001"]

[tool.uv]
# constraint-dependencies control the dependency versions
# across ALL members of the workspace. This is what lets
# us refer to dependencies by name in member projects and
# avoid having to specify matching versions everywhere.
constraint-dependencies = [
  "anyio~=4.14",
  "fastapi~=0.139.1",
  "pydantic~=2.13",
  "pydantic-settings~=2.14",
  "starlette~=1.3",
  "uvicorn[standard]~=0.49",
  "uvloop>=0.22.1",
]
package = false  # tell uv that the root IS NOT a package
required-version = " >=0.10.0"

[tool.uv.workspace]
members = ["libraries/fastapi-runner"]

# sources is inherited by workspace members so they will
# ALWAYS use the workspace sources regardless of whether
# individual packages are in pypi or not. This works in
# conjunction with tool.uv.workspace.members.
[tool.uv.sources]
fastapi-runner = { workspace = true }

# since I occasiontally work inside a sandbox
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
